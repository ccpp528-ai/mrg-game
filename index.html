<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MRG$ Global Empire</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Lexend:wght@900&family=Noto+Sans+Arabic:wght@900&display=swap');

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }

        body { 
            background: #000; color: #fff; margin: 0; padding: 0; 
            font-family: 'Noto Sans Arabic', sans-serif; overflow-x: hidden;
            background: radial-gradient(circle at 50% 40%, #1a1500 0%, #000 80%);
            height: 100vh; display: flex; flex-direction: column;
        }

        /* الرصيد العلوي */
        .header { padding: 50px 20px 20px; z-index: 10; }
        .score-val { font-family: 'Lexend', sans-serif; font-size: 4.8rem; color: #fff; margin: 0; line-height: 1; text-shadow: 0 0 30px rgba(255,215,0,0.3); }
        .token-name { color: #ffd700; font-size: 1.4rem; letter-spacing: 3px; font-weight: bold; margin-top: 10px; }

        /* منطقة العملة - التحسين الأهم هنا */
        .main-game { flex-grow: 1; display: flex; align-items: center; justify-content: center; position: relative; }
        
        /* الهالة الخلفية */
        .glow-effect {
            position: absolute; width: 300px; height: 300px;
            background: radial-gradient(circle, rgba(255, 215, 0, 0.15) 0%, transparent 70%);
            border-radius: 50%; z-index: 1; transition: transform 0.1s;
        }

        /* العملة - الاستجابة للنقر فقط على الصورة */
        .coin-btn {
            width: 280px; height: 280px; border-radius: 50%;
            cursor: pointer; position: relative; z-index: 5;
            transition: transform 0.05s cubic-bezier(0.1, 0.5, 1, 1);
            /* استبدل 'coin.png' برابط صورة العملة الأخيرة التي أعجبتك */
            background: url('coin.png') no-repeat center;
            background-size: cover;
            border: 4px solid #ffd700;
            box-shadow: 0 0 40px rgba(255, 215, 0, 0.2);
        }
        .coin-btn:active { transform: scale(0.94); }

        /* شريط الطاقة والمهام */
        .footer-ui { padding: 20px; background: rgba(0,0,0,0.8); border-top: 1px solid #222; }
        .energy-container { width: 90%; margin: 0 auto 20px; }
        .bar-outer { background: #111; height: 16px; border-radius: 20px; border: 1px solid #333; overflow: hidden; }
        .bar-inner { background: linear-gradient(90deg, #ffd700, #ff8c00); height: 100%; width: 100%; transition: width 0.1s; }
        
        .task-card {
            background: #0a0a0a; border: 2px dashed #ffd700; padding: 15px 25px;
            border-radius: 20px; display: flex; justify-content: space-between; align-items: center;
            text-decoration: none; color: white; margin-top: 10px;
        }
        .reward { background: #ffd700; color: #000; padding: 5px 15px; border-radius: 10px; font-weight: 900; }

        /* الأرقام المتطايرة */
        .tap-num {
            position: fixed; color: #fff; font-family: 'Lexend', sans-serif;
            font-size: 2.5rem; font-weight: 900; pointer-events: none;
            z-index: 100; animation: floatUp 0.6s ease-out forwards;
        }
        @keyframes floatUp {
            0% { opacity: 1; transform: translateY(0) scale(1); }
            100% { opacity: 0; transform: translateY(-120px) scale(1.5); }
        }
    </style>
</head>
<body>

    <div class="header">
        <div class="score-val" id="score">0.00</div>
        <div class="token-name">$MRG TOKEN</div>
    </div>

    <div class="main-game">
        <div class="glow-effect" id="glow"></div>
        <div class="coin-btn" id="coin"></div>
    </div>

    <div class="footer-ui">
        <div class="energy-container">
            <div class="bar-outer"><div class="bar-inner" id="eBar"></div></div>
            <div style="margin-top: 8px; font-weight: bold; color: #ffd700;">⚡ <span id="eNum">1000</span> / 1000</div>
        </div>

        <a href="https://t.me/mrg_community" class="task-card" id="task1">
            <span style="font-weight: bold;">JOIN MRG COMMUNITY</span>
            <span class="reward">+100.00</span>
        </a>
    </div>

    <script>
        let score = parseFloat(localStorage.getItem('mrg_v3_score')) || 0;
        let energy = parseInt(localStorage.getItem('mrg_v3_energy')) || 1000;

        function updateUI() {
            document.getElementById('score').innerText = score.toFixed(2);
            document.getElementById('eBar').style.width = (energy/10) + "%";
            document.getElementById('eNum').innerText = energy;
        }

        // معالج النقر المخصص للعملة فقط
        document.getElementById('coin').addEventListener('touchstart', function(e) {
            e.preventDefault();
            if (energy > 0) {
                const touch = e.changedTouches[0];
                handleTap(touch.clientX, touch.clientY);
            }
        });

        // دعم النقر بالماوس للتجربة
        document.getElementById('coin').addEventListener('mousedown', function(e) {
            if (energy > 0) handleTap(e.clientX, e.clientY);
        });

        function handleTap(x, y) {
            score += 0.05;
            energy -= 1;
            
            // تأثير الهالة
            document.getElementById('glow').style.transform = "scale(1.2)";
            setTimeout(() => document.getElementById('glow').style.transform = "scale(1)", 100);

            // الرقم المتطاير
            const num = document.createElement('div');
            num.className = 'tap-num';
            num.innerText = "+0.05";
            num.style.left = x + 'px';
            num.style.top = y + 'px';
            document.body.appendChild(num);
            setTimeout(() => num.remove(), 600);

            localStorage.setItem('mrg_v3_score', score);
            localStorage.setItem('mrg_v3_energy', energy);
            updateUI();
            if(navigator.vibrate) navigator.vibrate(10);
        }

        // نظام استعادة الطاقة
        setInterval(() => {
            if (energy < 1000) {
                energy++;
                updateUI();
            }
        }, 1500);

        updateUI();
    </script>
</body>
</html>
