<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MRG$ Empire Pro</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Lexend:wght@900&family=Noto+Sans+Arabic:wght@900&display=swap');
        
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; touch-action: manipulation; }
        
        body { 
            background: #000; color: #fff; margin: 0; padding: 0; 
            font-family: 'Noto Sans Arabic', sans-serif; height: 100vh;
            display: flex; flex-direction: column; overflow: hidden;
            background: radial-gradient(circle at 50% 30%, #1a1a00 0%, #000 80%);
        }

        /* الرصيد الاحترافي */
        .header { padding: 40px 20px 0; text-align: center; }
        .score-box { font-family: 'Lexend', sans-serif; font-size: 5rem; line-height: 1; text-shadow: 0 0 40px rgba(255,215,0,0.5); }
        .token-id { color: #ffd700; font-size: 1.2rem; font-weight: 900; letter-spacing: 5px; margin-top: 10px; }

        /* منطقة اللعب الذهبية */
        .play-area { flex-grow: 1; display: flex; align-items: center; justify-content: center; position: relative; }
        .glow-ring {
            position: absolute; width: 320px; height: 320px;
            background: radial-gradient(circle, rgba(255, 215, 0, 0.1) 0%, transparent 70%);
            border-radius: 50%; z-index: 1; animation: pulse 2s infinite alternate;
        }
        @keyframes pulse { from { transform: scale(1); opacity: 0.5; } to { transform: scale(1.2); opacity: 0.8; } }

        .coin-wrapper { position: relative; z-index: 10; cursor: pointer; transition: transform 0.05s; }
        .coin-wrapper:active { transform: scale(0.92); }

        .main-coin {
            width: 260px; height: 260px; border-radius: 50%;
            border: 8px solid #ffd700; box-shadow: 0 0 50px rgba(255, 215, 0, 0.3);
            background: url('https://i.ibb.co/VmxMdBz/mrg-coin.png') no-repeat center; /* رابط دائم للعملة الذهبية */
            background-size: cover;
        }

        /* شريط الطاقة والمهام */
        .ui-footer { padding: 30px 20px; background: rgba(0,0,0,0.9); border-top: 2px solid #111; }
        .energy-bar-wrap { width: 100%; height: 20px; background: #111; border-radius: 20px; border: 2px solid #333; overflow: hidden; position: relative; }
        .energy-fill { 
            height: 100%; width: 100%; background: linear-gradient(90deg, #ffd700, #ff8c00); 
            transition: width 0.1s linear, background 0.5s; 
        }
        
        .task-btn {
            margin-top: 25px; background: #000; border: 2px dashed #ffd700;
            border-radius: 25px; padding: 18px 25px; display: flex;
            justify-content: space-between; align-items: center; text-decoration: none; color: #fff;
        }
        .reward-tag { background: #ffd700; color: #000; padding: 6px 15px; border-radius: 12px; font-weight: 900; }

        /* الرقم المتطاير */
        .pop-val {
            position: fixed; color: #fff; font-family: 'Lexend', sans-serif; font-size: 3rem;
            font-weight: 900; pointer-events: none; z-index: 1000;
            animation: float-up 0.5s ease-out forwards;
        }
        @keyframes float-up { 0% { opacity: 1; transform: translateY(0); } 100% { opacity: 0; transform: translateY(-150px) scale(1.5); } }
    </style>
</head>
<body>

    <div class="header">
        <div class="score-box" id="scoreDisplay">0.00</div>
        <div class="token-id">$MRG TOKEN</div>
    </div>

    <div class="play-area">
        <div class="glow-ring"></div>
        <div class="coin-wrapper" id="coinCore">
            <div class="main-coin"></div>
        </div>
    </div>

    <div class="ui-footer">
        <div class="energy-bar-wrap">
            <div class="energy-fill" id="energyFill"></div>
        </div>
        <div style="text-align: center; margin-top: 10px; font-weight: bold; color: #ffd700;">
            ⚡ <span id="energyText">1000</span> / 1000
        </div>

        <a href="https://t.me/mrg_community" class="task-btn" id="task1">
            <span style="font-size: 1.2rem; font-weight: bold;">JOIN MRG COMMUNITY</span>
            <span class="reward-tag">+100.00</span>
        </a>
    </div>

    <script>
        let score = parseFloat(localStorage.getItem('mrg_pro_score')) || 0;
        let energy = parseInt(localStorage.getItem('mrg_pro_energy')) || 1000;

        // نظام الصوت المتطور (دون ملفات خارجية)
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playTapSound() {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(500 + (Math.random() * 200), audioCtx.currentTime);
            gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.start(); osc.stop(audioCtx.currentTime + 0.1);
        }

        function refreshUI() {
            document.getElementById('scoreDisplay').innerText = score.toFixed(2);
            document.getElementById('energyFill').style.width = (energy/10) + "%";
            document.getElementById('energyText').innerText = energy;
            
            // تغيير لون الطاقة عند الانخفاض
            if(energy < 200) document.getElementById('energyFill').style.background = "#ff4444";
            else document.getElementById('energyFill').style.background = "linear-gradient(90deg, #ffd700, #ff8c00)";
        }

        // النقر الحصري على العملة
        document.getElementById('coinCore').addEventListener('pointerdown', (e) => {
            if (energy > 0) {
                score += 0.05;
                energy -= 1;
                playTapSound();

                // تأثير الرقم
                const p = document.createElement('div');
                p.className = 'pop-val';
                p.innerText = "+0.05";
                p.style.left = e.clientX + 'px';
                p.style.top = e.clientY + 'px';
                document.body.appendChild(p);
                setTimeout(() => p.remove(), 500);

                localStorage.setItem('mrg_pro_score', score);
                localStorage.setItem('mrg_pro_energy', energy);
                refreshUI();
                if(navigator.vibrate) navigator.vibrate(10);
            }
        });

        // استعادة الطاقة
        setInterval(() => { if(energy < 1000) { energy++; refreshUI(); } }, 1500);

        // مهمة الاشتراك
        document.getElementById('task1').onclick = function() {
            if(!localStorage.getItem('mrg_task_done')) {
                score += 100;
                localStorage.setItem('mrg_task_done', 'true');
                localStorage.setItem('mrg_pro_score', score);
                refreshUI();
                this.style.opacity = "0.4";
            }
        };

        refreshUI();
    </script>
</body>
</html>
