<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MRG Global Empire</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Lexend:wght@900&family=Noto+Sans+Arabic:wght@800&display=swap');
        
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; outline: none; }
        
        body { 
            background: #000; color: #fff; text-align: center; 
            font-family: 'Noto Sans Arabic', sans-serif; 
            margin: 0; padding: 0; overflow-x: hidden;
            background: radial-gradient(circle at 50% 30%, #2a2200 0%, #000 70%);
        }

        /* الرصيد الاحترافي */
        .top-nav { padding: 40px 20px 20px; position: sticky; top: 0; z-index: 100; background: rgba(0,0,0,0.5); backdrop-filter: blur(10px); }
        .score-display { font-family: 'Lexend', sans-serif; font-size: 4.5rem; color: #ffd700; text-shadow: 0 0 25px rgba(255, 215, 0, 0.4); margin: 0; line-height: 1; }
        .token-tag { font-size: 1.2rem; color: #ffd700; letter-spacing: 4px; font-weight: bold; margin-top: 5px; }

        /* منطقة العملة */
        .game-zone { height: 60vh; display: flex; align-items: center; justify-content: center; position: relative; }
        .coin-base { 
            width: 260px; height: 260px; border-radius: 50%; border: 6px solid #ffd700;
            box-shadow: 0 0 60px rgba(255, 215, 0, 0.2), inset 0 0 20px rgba(255, 215, 0, 0.2);
            transition: transform 0.05s cubic-bezier(0.17, 0.67, 0.83, 0.67);
            cursor: pointer; position: relative; z-index: 10;
        }
        .coin-base:active { transform: scale(0.9) rotate(2deg); }

        /* شريط الطاقة */
        .energy-box { width: 80%; margin: 0 auto 40px; }
        .bar-container { background: #111; height: 14px; border-radius: 20px; border: 1.5px solid #333; overflow: hidden; }
        .bar-fill { background: linear-gradient(90deg, #ffd700, #ff8c00); height: 100%; width: 100%; transition: width 0.1s linear; }

        /* الأرقام المتطايرة */
        .float-val { 
            position: fixed; color: #fff; font-family: 'Lexend', sans-serif; font-size: 2.5rem; 
            font-weight: 900; pointer-events: none; z-index: 1000;
            animation: floatAway 0.5s ease-out forwards;
        }
        @keyframes floatAway {
            0% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
            100% { opacity: 0; transform: translate(-50%, -200px) scale(1.5); }
        }

        /* قائمة المهام */
        .tasks-section { padding: 20px; padding-bottom: 80px; }
        .task-card { 
            background: linear-gradient(145deg, #111, #0a0a0a); border: 1px solid rgba(255, 215, 0, 0.2);
            padding: 22px; border-radius: 24px; display: flex; justify-content: space-between; 
            align-items: center; text-decoration: none; color: white; margin-bottom: 15px;
        }
        .reward-pill { background: #ffd700; color: #000; padding: 6px 14px; border-radius: 12px; font-weight: 900; }
    </style>
</head>
<body>

    <div class="top-nav">
        <h1 class="score-display" id="mainScore">0.00</h1>
        <div class="token-tag">$MRG TOKEN</div>
    </div>

    <div class="game-zone" id="touchArea">
        <img src="logo.jpg" class="coin-base" id="mainCoin">
    </div>

    <div class="energy-box">
        <div class="bar-container"><div class="bar-fill" id="eFill"></div></div>
        <div style="margin-top: 10px; color: #ffd700; font-weight: bold; font-size: 1.2rem;">⚡ <span id="eNum">1000</span></div>
    </div>

    <div class="tasks-section">
        <a href="https://t.me/mrg_community" class="task-card" id="task1">
            <span style="font-size: 1.1rem; font-weight: bold;">انضم للقناة العالمية</span>
            <span class="reward-pill">+100.00</span>
        </a>
    </div>

    <script>
        let score = parseFloat(localStorage.getItem('mrg_global_score')) || 0;
        let energy = parseInt(localStorage.getItem('mrg_global_energy')) || 1000;
        const scoreDisplay = document.getElementById('mainScore');

        // محرك الصوت المتقدم
        const context = new (window.AudioContext || window.webkitAudioContext)();
        function playPop() {
            const osc = context.createOscillator();
            const gain = context.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(400 + Math.random() * 100, context.currentTime);
            gain.gain.setValueAtTime(0.1, context.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, context.currentTime + 0.1);
            osc.connect(gain);
            gain.connect(context.destination);
            osc.start();
            osc.stop(context.currentTime + 0.1);
        }

        function update() {
            scoreDisplay.innerText = score.toFixed(2);
            document.getElementById('eFill').style.width = (energy/10) + "%";
            document.getElementById('eNum').innerText = energy;
        }

        document.getElementById('touchArea').addEventListener('touchstart', (e) => {
            e.preventDefault();
            if (energy > 0) {
                Array.from(e.changedTouches).forEach(t => {
                    score += 0.05;
                    energy -= 1;
                    playPop();

                    const n = document.createElement('div');
                    n.innerText = "+0.05";
                    n.className = 'float-val';
                    n.style.left = t.clientX + 'px';
                    n.style.top = t.clientY + 'px';
                    document.body.appendChild(n);
                    setTimeout(() => n.remove(), 500);
                });
                localStorage.setItem('mrg_global_score', score);
                localStorage.setItem('mrg_global_energy', energy);
                update();
                if(navigator.vibrate) navigator.vibrate(10);
            }
        }, {passive: false});

        document.getElementById('task1').onclick = function() {
            if(!localStorage.getItem('global_task_v1')) {
                score += 100;
                localStorage.setItem('global_task_v1', 'done');
                localStorage.setItem('mrg_global_score', score);
                update();
                this.style.opacity = "0.3";
            }
        };

        setInterval(() => { if(energy < 1000) { energy++; update(); } }, 1500);
        update();
    </script>
</body>
</html>
