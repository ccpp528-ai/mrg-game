<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MRG Token - Official</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Lexend:wght@800&display=swap');
        
        body { 
            background: #000; color: white; text-align: center; 
            font-family: sans-serif; margin: 0; padding: 0;
            overflow-y: auto; overflow-x: hidden;
            background-image: radial-gradient(circle at 50% 40%, #1a1a1a 0%, #000 100%);
        }

        /* الجزء العلوي - الرصيد كما في الصورة */
        .balance-container { margin-top: 50px; }
        .balance-num { font-family: 'Lexend', sans-serif; font-size: 5rem; color: #fff; margin: 0; text-shadow: 0 0 20px rgba(255, 215, 0, 0.4); }
        .token-symbol { color: #ffd700; font-weight: bold; font-size: 1.5rem; letter-spacing: 2px; }

        /* منطقة العملة والدوائر الكهربائية */
        .coin-section { position: relative; width: 320px; height: 320px; margin: 30px auto; display: flex; align-items: center; justify-content: center; }
        .circuit-bg { 
            position: absolute; width: 100%; height: 100%; 
            background: url('https://i.ibb.co/LzYvXG8/circuit.png') no-repeat center; /* خلفية افتراضية تشبه الصورة */
            background-size: contain; opacity: 0.6; z-index: 1; animation: rotateBg 20s linear infinite;
        }
        @keyframes rotateBg { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

        .main-coin { 
            width: 200px; height: 200px; border-radius: 50%; border: 6px solid #ffd700;
            box-shadow: 0 0 50px rgba(255, 215, 0, 0.5); z-index: 5; transition: transform 0.05s;
        }

        /* شريط الطاقة الذهبي */
        .energy-section { width: 90%; margin: 20px auto; }
        .bar-bg { background: #1a1a1a; height: 26px; border-radius: 15px; border: 3px solid #333; overflow: hidden; position: relative; }
        .bar-fill { 
            background: linear-gradient(90deg, #ffcc00 0%, #ff9900 100%); 
            height: 100%; width: 100%; transition: width 0.2s; box-shadow: 0 0 15px #ffcc00;
        }
        .energy-text { margin-top: 10px; font-weight: bold; font-size: 1.5rem; color: #fff; display: flex; align-items: center; justify-content: center; gap: 10px; }

        /* الأرقام المتطايرة */
        .pop-text { position: fixed; color: #fff; font-size: 2.5rem; font-weight: 900; pointer-events: none; z-index: 999; animation: fly 0.6s ease-out forwards; }
        @keyframes fly { 0% { opacity: 1; transform: translateY(0); } 100% { opacity: 0; transform: translateY(-150px) scale(1.5); } }

        /* منطقة المهام (الخط المقطع كما في الصورة) */
        .task-area { 
            width: 90%; margin: 40px auto; padding: 20px;
            border: 2px dashed #ffd700; border-radius: 25px;
            display: flex; justify-content: space-between; align-items: center;
            background: rgba(255, 215, 0, 0.05); text-decoration: none; color: white;
        }
        .task-reward { background: #ffd700; color: #000; padding: 8px 18px; border-radius: 15px; font-weight: 900; font-size: 1.2rem; }
    </style>
</head>
<body>

    <div class="balance-container">
        <h1 class="balance-num" id="score">0.00</h1>
        <div class="token-symbol">MRG TOKEN$</div>
    </div>

    <div class="coin-section" id="tapZone">
        <div class="circuit-bg"></div>
        <img src="logo.jpg" class="main-coin" id="coinImg">
    </div>

    <div class="energy-section">
        <div class="bar-bg"><div class="bar-fill" id="energyFill"></div></div>
        <div class="energy-text">⚡ <span id="energyVal">1000</span> / 1000 ⚡</div>
    </div>

    <a href="https://t.me/mrg_community" class="task-area" id="joinTask">
        <div style="text-align: right;">
            <div style="font-weight: bold; font-size: 1.2rem;">L MRG community اسنحي</div>
        </div>
        <div class="task-reward">+100.00</div>
    </a>

    <audio id="pop" src="https://assets.mixkit.co/active_storage/sfx/2571/2571-preview.mp3" preload="auto"></audio>

    <script>
        let score = parseFloat(localStorage.getItem('final_v_score')) || 0;
        let energy = parseInt(localStorage.getItem('final_v_energy')) || 1000;
        const scoreEl = document.getElementById('score');
        const popSfx = document.getElementById('pop');

        function update() {
            scoreEl.innerText = score.toFixed(2);
            document.getElementById('energyFill').style.width = (energy/10) + "%";
            document.getElementById('energyVal').innerText = energy;
        }

        document.getElementById('tapZone').addEventListener('click', (e) => {
            if (energy > 0) {
                score += 0.05; energy--;
                popSfx.currentTime = 0; popSfx.play();
                
                const n = document.createElement('div');
                n.innerText = "+0.05";
                n.className = 'pop-text';
                n.style.left = e.clientX + 'px'; n.style.top = e.clientY + 'px';
                document.body.appendChild(n);
                setTimeout(() => n.remove(), 600);

                localStorage.setItem('final_v_score', score);
                localStorage.setItem('final_v_energy', energy);
                update();
                
                document.getElementById('coinImg').style.transform = "scale(0.92)";
                setTimeout(() => document.getElementById('coinImg').style.transform = "scale(1)", 50);
                if(navigator.vibrate) navigator.vibrate(15);
            }
        });

        document.getElementById('joinTask').onclick = function() {
            if(!localStorage.getItem('task_verified')) {
                score += 100;
                localStorage.setItem('task_verified', 'true');
                localStorage.setItem('final_v_score', score);
                update();
                this.style.opacity = "0.5";
            }
        };

        setInterval(() => { if(energy < 1000) { energy++; update(); } }, 1500);
        update();
    </script>
</body>
</html>
