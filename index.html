<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MRG Final Empire</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@900&family=Oswald:wght@700&display=swap');
        
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { 
            background: #000; background-image: radial-gradient(circle at center, #201a00 0%, #000 100%);
            color: white; text-align: center; font-family: 'Cairo', sans-serif; 
            height: 100vh; margin: 0; display: flex; flex-direction: column; align-items: center; 
            overflow: hidden; touch-action: none;
        }

        .header { margin-top: 50px; position: relative; z-index: 10; }
        .balance { font-family: 'Oswald', sans-serif; font-size: 5.5rem; color: #ffd700; text-shadow: 0 0 30px rgba(255, 215, 0, 0.5); margin: 0; }
        .unit { font-size: 1.5rem; color: #ffd700; font-weight: bold; margin-top: -10px; letter-spacing: 3px; }

        .coin-area { position: relative; margin: 40px 0; perspective: 1000px; }
        .coin-img { 
            width: 270px; height: 270px; border-radius: 50%; border: 8px solid #ffd700; 
            box-shadow: 0 0 80px rgba(255, 215, 0, 0.3); transition: transform 0.05s ease-out;
            will-change: transform; object-fit: cover;
        }

        .energy-box { width: 85%; }
        .bar-outer { background: rgba(255,255,255,0.05); height: 24px; border-radius: 30px; border: 2px solid #444; overflow: hidden; position: relative; }
        .bar-inner { background: linear-gradient(90deg, #ffd700, #ff8c00); height: 100%; width: 100%; transition: width 0.1s linear; }

        .tap-num { 
            position: fixed; color: #fff; font-family: 'Oswald', sans-serif; font-size: 3.5rem; font-weight: 700; 
            pointer-events: none; z-index: 9999; animation: float 0.5s ease-out forwards; 
            text-shadow: 0 0 15px #ffd700; will-change: transform, opacity;
        }
        @keyframes float {
            0% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
            100% { opacity: 0; transform: translate(-50%, -250px) scale(1.6) rotate(10deg); }
        }

        .task { 
            background: rgba(255, 215, 0, 0.1); border: 1px solid #ffd700; padding: 20px; 
            border-radius: 25px; width: 90%; display: flex; justify-content: space-between; 
            align-items: center; margin-top: 40px; text-decoration: none; color: white;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1 class="balance" id="bDisplay">0.00</h1>
        <div class="unit">$MRG TOKEN</div>
    </div>

    <div class="coin-area" id="tapZone">
        <img src="logo.jpg" class="coin-img" id="coinBody">
    </div>

    <div class="energy-box">
        <div class="bar-outer"><div class="bar-inner" id="eFill"></div></div>
        <p style="font-size: 1.5rem; margin-top: 10px; color: #ffd700;">⚡ <span id="eNum">1000</span></p>
    </div>

    <a href="https://t.me/mrg_community" class="task" id="tBtn">
        <span style="font-weight: bold;">انضم لـ MRG community</span>
        <span style="background: #ffd700; color: #000; padding: 5px 15px; border-radius: 12px; font-weight: 900;">+100.00</span>
    </a>

    <script>
        let score = parseFloat(localStorage.getItem('mrg_final_v1_score')) || 0;
        let energy = parseInt(localStorage.getItem('mrg_final_v1_energy')) || 1000;
        const bDisplay = document.getElementById('bDisplay');
        const coinBody = document.getElementById('coinBody');

        // نظام الصوت المتعدد لعدم حدوث انقطاع
        const audioPool = Array.from({length: 10}, () => new Audio('https://www.soundjay.com/buttons/sounds/button-16.mp3'));
        let audioIdx = 0;

        function playSound() {
            const sound = audioPool[audioIdx];
            sound.currentTime = 0;
            sound.play().catch(()=>{});
            audioIdx = (audioIdx + 1) % audioPool.length;
        }

        function refresh() {
            bDisplay.innerText = score.toFixed(2);
            document.getElementById('eFill').style.width = (energy/10) + "%";
            document.getElementById('eNum').innerText = energy;
        }

        document.getElementById('tapZone').addEventListener('touchstart', (e) => {
            e.preventDefault(); // منع التحكم في الشاشة أو التكبير
            if (energy > 0) {
                Array.from(e.changedTouches).forEach(t => {
                    score += 0.05;
                    energy -= 1;
                    playSound();

                    const n = document.createElement('div');
                    n.innerText = "+0.05";
                    n.className = 'tap-num';
                    n.style.left = t.clientX + 'px';
                    n.style.top = t.clientY + 'px';
                    document.body.appendChild(n);
                    setTimeout(() => n.remove(), 500);
                });

                localStorage.setItem('mrg_final_v1_score', score);
                localStorage.setItem('mrg_final_v1_energy', energy);
                refresh();
                if(navigator.vibrate) navigator.vibrate(15);
                
                coinBody.style.transform = "scale(0.94)";
                setTimeout(() => coinBody.style.transform = "scale(1)", 50);
            }
        }, {passive: false});

        document.getElementById('tBtn').onclick = function() {
            if(!localStorage.getItem('mrg_final_task')) {
                score += 100;
                localStorage.setItem('mrg_final_task', 'done');
                localStorage.setItem('mrg_final_v1_score', score);
                refresh();
                this.style.display = "none";
            }
        };

        setInterval(() => { if(energy < 1000) { energy++; refresh(); } }, 1500);
        refresh();
    </script>
</body>
</html>
