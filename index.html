<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MRG Ultra Pro</title>
    <style>
        body { background: #000; color: white; text-align: center; font-family: sans-serif; height: 100vh; margin: 0; display: flex; flex-direction: column; align-items: center; overflow: hidden; touch-action: manipulation; }
        .header { margin-top: 40px; }
        .score { font-size: 3.5rem; font-weight: bold; color: #ffd700; text-shadow: 0 0 20px rgba(255, 215, 0, 0.5); }
        
        .coin-container { position: relative; margin: 30px 0; z-index: 10; }
        .coin-img { width: 240px; height: 240px; border-radius: 50%; border: 6px solid #ffd700; box-shadow: 0 0 60px rgba(255, 215, 0, 0.2); transition: transform 0.05s; }
        .coin-img:active { transform: scale(0.92); }

        .energy-box { width: 85%; margin-top: 10px; }
        .bar-bg { background: #222; height: 16px; border-radius: 20px; border: 1px solid #444; overflow: hidden; }
        .bar-fill { background: linear-gradient(90deg, #ffd700, #ffaa00); height: 100%; width: 100%; transition: width 0.2s; }

        .tasks { width: 90%; margin-top: 30px; }
        .task-card { background: rgba(255,255,255,0.07); border: 1px solid #ffd70033; padding: 15px; border-radius: 18px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; text-decoration: none; color: white; }

        /* تأثير الأرقام المتطايرة - السر هنا */
        .fly-text { position: fixed; color: #ffd700; font-size: 2.2rem; font-weight: 900; pointer-events: none; z-index: 9999; animation: floatUp 0.7s ease-out forwards; text-shadow: 0 2px 10px rgba(0,0,0,0.5); }
        @keyframes floatUp { 0% { opacity: 1; transform: translateY(0) scale(1); } 100% { opacity: 0; transform: translateY(-150px) scale(1.2); } }
    </style>
</head>
<body>

    <div class="header">
        <div class="score" id="score">0.00</div>
        <div style="color: #ffd700; font-size: 1.2rem; font-weight: bold;">$MRG</div>
    </div>

    <div class="coin-container" id="tapArea">
        <img src="logo.jpg" class="coin-img" id="coin">
    </div>

    <div class="energy-box">
        <div class="bar-bg"><div class="bar-fill" id="energyBar"></div></div>
        <p>⚡ <span id="energyVal">1000</span>/1000</p>
    </div>

    <div class="tasks">
        <a href="https://t.me/mrg_community" class="task-card" id="task1">
            <span>انضم لـ MRG community</span>
            <b style="background: #ffd700; color: black; padding: 5px 10px; border-radius: 10px;">+100.00</b>
        </a>
    </div>

    <script>
        let score = parseFloat(localStorage.getItem('mrg_score')) || 0;
        let energy = parseInt(localStorage.getItem('mrg_energy')) || 1000;

        const update = () => {
            document.getElementById('score').innerText = score.toFixed(2);
            document.getElementById('energyBar').style.width = (energy/10) + "%";
            document.getElementById('energyVal').innerText = energy;
        };

        document.getElementById('tapArea').addEventListener('touchstart', (e) => {
            e.preventDefault();
            if (energy > 0) {
                score += 0.05;
                energy -= 1;
                
                // إنشاء الرقم الطائر في مكان اللمس بالضبط
                const touch = e.touches[0];
                const text = document.createElement('div');
                text.innerText = "+0.05";
                text.className = 'fly-text';
                text.style.left = touch.clientX + 'px';
                text.style.top = touch.clientY + 'px';
                document.body.appendChild(text);
                setTimeout(() => text.remove(), 700);

                localStorage.setItem('mrg_score', score);
                localStorage.setItem('mrg_energy', energy);
                update();
                if(navigator.vibrate) navigator.vibrate(15);
            }
        });

        // مهمة القناة
        document.getElementById('task1').onclick = function() {
            if(!localStorage.getItem('done_v1')) {
                score += 100;
                localStorage.setItem('done_v1', 'true');
                localStorage.setItem('mrg_score', score);
                update();
                this.style.display = 'none';
            }
        };

        setInterval(() => { if(energy < 1000) { energy++; update(); } }, 2000);
        update();
    </script>
</body>
</html>
