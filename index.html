<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MRG Ultra Pro</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@700;900&display=swap');
        body { background: radial-gradient(circle at center, #1a1a1a 0%, #000 100%); color: white; text-align: center; font-family: 'Cairo', sans-serif; height: 100vh; margin: 0; display: flex; flex-direction: column; align-items: center; overflow: hidden; touch-action: none; }
        .header { margin-top: 50px; position: relative; z-index: 5; }
        .score { font-size: 4rem; font-weight: 900; color: #ffd700; text-shadow: 0 0 30px rgba(255, 215, 0, 0.6); line-height: 1; }
        
        .coin-wrapper { position: relative; margin: 40px 0; z-index: 10; perspective: 1000px; }
        .coin-img { width: 250px; height: 250px; border-radius: 50%; border: 8px solid #ffd700; box-shadow: 0 0 80px rgba(255, 215, 0, 0.25); cursor: pointer; transform-style: preserve-3d; transition: transform 0.05s cubic-bezier(0.1, 0.7, 1.0, 0.1); }

        .energy-container { width: 80%; margin-top: 20px; }
        .bar-bg { background: rgba(255,255,255,0.1); height: 18px; border-radius: 20px; border: 1px solid #ffd700; overflow: hidden; box-shadow: inset 0 0 10px #000; }
        .bar-fill { background: linear-gradient(90deg, #ffd700, #ff8c00); height: 100%; width: 100%; transition: width 0.1s linear; }

        /* الأرقام المتطايرة الاحترافية */
        .pop-text { position: absolute; color: #ffd700; font-size: 2.5rem; font-weight: 900; pointer-events: none; z-index: 100; animation: moveUp 0.6s ease-out forwards; text-shadow: 0 4px 15px rgba(0,0,0,0.8); }
        @keyframes moveUp { 0% { opacity: 1; transform: translateY(0) scale(1) rotate(0deg); } 100% { opacity: 0; transform: translateY(-200px) scale(1.5) rotate(15deg); } }

        .tasks-list { width: 90%; margin-top: 40px; }
        .task-item { background: rgba(255, 215, 0, 0.1); border: 1.5px dashed #ffd700; padding: 15px; border-radius: 20px; display: flex; justify-content: space-between; align-items: center; text-decoration: none; color: white; transition: 0.3s; }
    </style>
</head>
<body>

    <div class="header">
        <div class="score" id="scoreDisplay">0.00</div>
        <div style="letter-spacing: 5px; color: #ffd700; opacity: 0.8;">$MRG</div>
    </div>

    <div class="coin-wrapper" id="coinArea">
        <img src="logo.jpg" id="mainCoin" class="coin-img">
    </div>

    <div class="energy-container">
        <div class="bar-bg"><div class="bar-fill" id="energyBar"></div></div>
        <p style="font-size: 1.2rem; margin-top: 10px; font-weight: bold;">⚡ <span id="energyText">1000</span></p>
    </div>

    <div class="tasks-list">
        <a href="https://t.me/mrg_community" class="task-item" id="btnTask">
            <span style="font-weight: bold;">انضم للقناة الرسمية</span>
            <span style="background: #ffd700; color: #000; padding: 5px 15px; border-radius: 12px; font-weight: 900;">+100.00</span>
        </a>
    </div>

    <script>
        let score = parseFloat(localStorage.getItem('mrg_v4_score')) || 0;
        let energy = parseInt(localStorage.getItem('mrg_v4_energy')) || 1000;
        const scoreDisplay = document.getElementById('scoreDisplay');
        const mainCoin = document.getElementById('mainCoin');

        function syncUI() {
            scoreDisplay.innerText = score.toFixed(2);
            document.getElementById('energyBar').style.width = (energy/10) + "%";
            document.getElementById('energyText').innerText = energy;
        }

        document.getElementById('coinArea').addEventListener('touchstart', (e) => {
            if (energy > 0) {
                // معالجة كل لمسة بشكل منفصل ليدعم النقر المتعدد (Multi-touch)
                Array.from(e.changedTouches).forEach(touch => {
                    score += 0.05;
                    energy -= 1;
                    
                    // إنشاء الرقم المتطاير
                    const p = document.createElement('div');
                    p.innerText = "+0.05";
                    p.className = 'pop-text';
                    p.style.left = touch.clientX - 40 + 'px';
                    p.style.top = touch.clientY - 40 + 'px';
                    document.body.appendChild(p);
                    setTimeout(() => p.remove(), 600);
                });

                localStorage.setItem('mrg_v4_score', score);
                localStorage.setItem('mrg_v4_energy', energy);
                syncUI();
                if(navigator.vibrate) navigator.vibrate(10);
                
                // حركة العملة
                mainCoin.style.transform = "scale(0.9) rotateX(10deg)";
                setTimeout(() => mainCoin.style.transform = "scale(1)", 50);
            }
        });

        document.getElementById('btnTask').onclick = function() {
            if(!localStorage.getItem('mrg_v4_task')) {
                score += 100;
                localStorage.setItem('mrg_v4_task', 'done');
                localStorage.setItem('mrg_v4_score', score);
                syncUI();
                this.style.display = "none";
            }
        };

        setInterval(() => { if(energy < 1000) { energy++; syncUI(); } }, 1500);
        syncUI();
    </script>
</body>
</html>
