<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>MRG Empire</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Lexend:wght@400;800&family=Noto+Sans+Arabic:wght@700;900&display=swap');
        
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body { 
            background: #050505; 
            color: #fff; text-align: center; 
            font-family: 'Noto Sans Arabic', sans-serif; 
            margin: 0; padding: 0;
            overflow-y: auto; overflow-x: hidden;
            background-image: radial-gradient(circle at 50% 20%, #1a1500 0%, #050505 80%);
        }

        /* الرصيد */
        .header-section { margin-top: 50px; padding: 20px; }
        .balance-label { font-size: 1rem; color: #ffd700; opacity: 0.7; letter-spacing: 2px; }
        .main-balance { font-family: 'Lexend', sans-serif; font-size: 5rem; font-weight: 800; margin: 5px 0; color: #fff; }

        /* منطقة النقر */
        .coin-portal { position: relative; margin: 30px auto; width: 280px; height: 280px; display: flex; align-items: center; justify-content: center; }
        .portal-ring { 
            position: absolute; width: 100%; height: 100%; 
            border: 2px solid rgba(255, 215, 0, 0.1); border-radius: 50%;
            box-shadow: 0 0 50px rgba(255, 215, 0, 0.05);
        }
        .main-coin { 
            width: 240px; height: 240px; border-radius: 50%; border: 4px solid #ffd700; 
            box-shadow: 0 0 40px rgba(255, 215, 0, 0.2); z-index: 5; transition: transform 0.05s cubic-bezier(0, 0, 0.2, 1);
            cursor: pointer; object-fit: cover;
        }

        /* شريط الطاقة */
        .stats-container { width: 85%; margin: 20px auto; }
        .energy-wrapper { background: rgba(255,255,255,0.03); height: 12px; border-radius: 10px; border: 1px solid rgba(255,215,0,0.2); overflow: hidden; }
        .energy-bar { background: #ffd700; height: 100%; width: 100%; transition: width 0.3s ease; box-shadow: 0 0 15px #ffd700; }
        .energy-info { margin-top: 10px; font-size: 1rem; color: #ffd700; font-family: 'Lexend', sans-serif; }

        /* الأرقام المتطايرة */
        .tap-effect { 
            position: fixed; color: #fff; font-family: 'Lexend', sans-serif; font-size: 2.5rem; font-weight: 800; 
            pointer-events: none; z-index: 1000; animation: rise 0.7s ease-out forwards;
        }
        @keyframes rise { 0% { opacity: 1; transform: translateY(0); } 100% { opacity: 0; transform: translateY(-150px) scale(1.2); } }

        /* المهام */
        .tasks-group { width: 90%; margin: 40px auto; padding-bottom: 50px; }
        .task-box { 
            background: linear-gradient(145deg, #111, #080808); 
            border: 1px solid rgba(255, 215, 0, 0.15); padding: 20px; 
            border-radius: 20px; display: flex; justify-content: space-between; align-items: center; 
            text-decoration: none; color: white; margin-bottom: 15px; transition: 0.3s;
        }
        .task-box:hover { border-color: #ffd700; }
        .reward { background: #ffd700; color: #000; padding: 5px 12px; border-radius: 10px; font-weight: 900; font-size: 0.9rem; }
    </style>
</head>
<body>

    <div class="header-section">
        <div class="balance-label">رصيد $MRG TOKEN</div>
        <h1 class="main-balance" id="scoreValue">0.00</h1>
    </div>

    <div class="coin-portal" id="tapArea">
        <div class="portal-ring"></div>
        <img src="logo.jpg" class="main-coin" id="coinEntity">
    </div>

    <div class="stats-container">
        <div class="energy-wrapper"><div class="energy-bar" id="energyFill"></div></div>
        <div class="energy-info">⚡ <span id="energyNum">1000</span> / 1000</div>
    </div>

    <div class="tasks-group">
        <a href="https://t.me/mrg_community" class="task-box" id="mrgTask">
            <span style="font-size: 1.1rem;">انضم لمجتمع MRG الرسمي</span>
            <span class="reward">+100.00</span>
        </a>
    </div>

    <audio id="sfx" src="https://assets.mixkit.co/active_storage/sfx/2571/2571-preview.mp3" preload="auto"></audio>

    <script>
        let score = parseFloat(localStorage.getItem('mrg_v_emp_score')) || 0;
        let energy = parseInt(localStorage.getItem('mrg_v_emp_energy')) || 1000;
        const scoreText = document.getElementById('scoreValue');
        const coin = document.getElementById('coinEntity');
        const popSfx = document.getElementById('sfx');

        function updateDisplay() {
            scoreText.innerText = score.toFixed(2);
            document.getElementById('energyFill').style.width = (energy/10) + "%";
            document.getElementById('energyNum').innerText = energy;
        }

        document.getElementById('tapArea').addEventListener('click', (e) => {
            if (energy > 0) {
                score += 0.05;
                energy -= 1;
                
                // الصوت
                popSfx.currentTime = 0;
                popSfx.play();

                // تأثير الرقم
                const p = document.createElement('div');
                p.innerText = "+0.05";
                p.className = 'tap-effect';
                p.style.left = e.clientX + 'px';
                p.style.top = e.clientY + 'px';
                document.body.appendChild(p);
                setTimeout(() => p.remove(), 700);

                localStorage.setItem('mrg_v_emp_score', score);
                localStorage.setItem('mrg_v_emp_energy', energy);
                updateDisplay();
                
                coin.style.transform = "scale(0.94)";
                setTimeout(() => coin.style.transform = "scale(1)", 50);
                if(navigator.vibrate) navigator.vibrate(15);
            }
        });

        document.getElementById('mrgTask').onclick = function() {
            if(!localStorage.getItem('emp_task_done')) {
                score += 100;
                localStorage.setItem('emp_task_done', 'true');
                localStorage.setItem('mrg_v_emp_score', score);
                updateDisplay();
                this.style.opacity = "0.4";
            }
        };

        setInterval(() => { if(energy < 1000) { energy++; updateDisplay(); } }, 2000);
        updateDisplay();
    </script>
</body>
</html>
